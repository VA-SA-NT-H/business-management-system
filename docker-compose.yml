version: "3.8"

services:

  mysql:
    image: mysql:8

    container_name: ebms-db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ebms

    ports:
      - "3306:3306"

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -proot" ]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ebms-backend-image
    container_name: ebms-backend
    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./ebms-frontend
      dockerfile: Dockerfile
    image: ebms-frontend-image
    container_name: ebms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
